<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>רשימת קניות</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f0f12;
  --surface: #1a1a20;
  --surface2: #22222c;
  --border: #2e2e3a;
  --accent: #f5c842;
  --accent2: #e8a020;
  --text: #eeeef2;
  --muted: #888;
  --danger: #e05555;
  --success: #4caf7d;
  --r: 13px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Heebo', sans-serif; background: var(--bg); color: var(--text); direction: rtl; }

/* ── TOOLBAR ── */
#toolbar {
  position: fixed;
  top: 0; right: 0; left: 0;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  box-shadow: 0 2px 16px rgba(0,0,0,.6);
  z-index: 9999;
  padding: 8px 12px 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

/* שורה עליונה: אינפוט + הוסף */
#tb-top {
  display: flex;
  gap: 7px;
  align-items: center;
}

/* גריד 2x2 לכפתורים */
#tb-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 7px;
}

#new-item {
  flex: 1;
  min-width: 0;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 9px;
  color: var(--text);
  font-family: 'Heebo', sans-serif;
  font-size: 15px;
  padding: 9px 12px;
  outline: none;
}
#new-item:focus { border-color: var(--accent); }

.tb-btn {
  font-family: 'Heebo', sans-serif;
  font-weight: 700;
  font-size: 13px;
  border: none;
  border-radius: 9px;
  cursor: pointer;
  padding: 9px 14px;
  white-space: nowrap;
  text-align: center;
  -webkit-tap-highlight-color: transparent;
}
#btn-add    { background: var(--accent); color: #111; flex-shrink: 0; }
#btn-del    { background: transparent; color: var(--danger); border: 1px solid var(--danger); padding: 9px 11px; flex-shrink: 0; }
#btn-update { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
#btn-auto   { background: #0d2230; color: #7ec8e3; border: 1px solid #1a3d52; }

/* ── MAIN ── */
#main {
  padding-top: 140px;
  padding-bottom: 100px;
  max-width: 600px;
  margin: 0 auto;
  padding-right: 14px;
  padding-left: 14px;
}

/* ── PASTE SCREEN ── */
#paste-screen { display: flex; flex-direction: column; gap: 14px; padding-top: 10px; }
#paste-screen h1 { font-size: 26px; font-weight: 900; color: var(--accent); }
#paste-screen p  { color: var(--muted); font-size: 14px; }
#paste-area {
  width: 100%; min-height: 180px;
  background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--r);
  color: var(--text); font-family: 'Heebo', sans-serif; font-size: 16px;
  padding: 14px; outline: none; resize: vertical; line-height: 1.7;
}
#paste-area:focus { border-color: var(--accent); }
#paste-area::placeholder { color: #444; }
#btn-confirm {
  width: 100%; padding: 14px;
  background: var(--accent); color: #111; border-radius: var(--r);
  font-family: 'Heebo', sans-serif; font-size: 17px; font-weight: 800;
  border: none; cursor: pointer;
}

/* ── LIST SCREEN ── */
#list-screen { display: none; }

#stats {
  display: flex; gap: 14px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r); padding: 12px 16px; margin-bottom: 10px;
}
.stat { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.stat-num { font-size: 22px; font-weight: 900; color: var(--accent); }
.stat-lbl { font-size: 11px; color: var(--muted); }

#prog-wrap { height: 5px; background: var(--border); border-radius: 99px; margin-bottom: 18px; overflow: hidden; }
#prog-bar  { height: 100%; background: linear-gradient(90deg, var(--success), var(--accent)); border-radius: 99px; transition: width .4s; }

.cat-label { font-size: 11px; font-weight: 700; letter-spacing: 1.5px; color: var(--muted); padding: 14px 4px 6px; text-transform: uppercase; }

.item {
  display: flex; align-items: center; gap: 12px;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r);
  padding: 13px 14px; margin-bottom: 8px; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.item.done { opacity: .55; }
.chk {
  width: 26px; height: 26px; flex-shrink: 0;
  border: 2px solid var(--border); border-radius: 7px;
  display: flex; align-items: center; justify-content: center; transition: all .2s;
}
.item.done .chk { background: var(--success); border-color: var(--success); }
.chk svg { opacity: 0; transform: scale(.5); transition: all .2s; }
.item.done .chk svg { opacity: 1; transform: scale(1); }
.item-text { flex: 1; font-size: 16px; font-weight: 500; }
.item.done .item-text { text-decoration: line-through; color: #555; }
.item-x { flex-shrink: 0; color: #444; padding: 4px; }
.item:hover .item-x { color: var(--danger); }

#empty { text-align: center; padding: 50px 20px; color: var(--muted); display: none; }

/* ── FINISH BTN ── */
#btn-finish {
  position: fixed; bottom: 20px; left: 50%;
  transform: translateX(-50%);
  background: linear-gradient(135deg, var(--success), #2e9e5e);
  color: #fff; border-radius: 30px; font-size: 16px; font-weight: 800;
  font-family: 'Heebo', sans-serif;
  padding: 14px 34px; box-shadow: 0 4px 24px rgba(76,175,125,.45);
  border: none; cursor: pointer;
  z-index: 90; display: none; white-space: nowrap;
  -webkit-tap-highlight-color: transparent;
}

/* ── MODALS ── */
.overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.78); z-index: 10000;
  align-items: center; justify-content: center; padding: 16px;
}
.overlay.show { display: flex; }
.modal {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 20px; padding: 26px 22px 20px;
  width: 100%; max-width: 340px; text-align: center;
  max-height: 85vh; overflow-y: auto;
}
.modal.wide { max-width: 420px; }
.modal-icon { font-size: 34px; margin-bottom: 8px; }
.modal h3 { font-size: 19px; font-weight: 800; margin-bottom: 6px; }
.modal p  { color: var(--muted); font-size: 13px; margin-bottom: 18px; }
.mbtn-row { display: flex; gap: 10px; }
.mbtn-row button {
  flex: 1; padding: 12px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--surface);
  color: var(--text); font-family: 'Heebo', sans-serif; font-size: 14px; font-weight: 700;
  cursor: pointer;
}
.mbtn-row .primary { background: var(--accent); color: #111; border-color: var(--accent); }
.mbtn-row .danger  { background: var(--danger); color: #fff; border-color: var(--danger); }

#nl-items { text-align: right; }
.nl-toggle { font-size: 12px; color: var(--accent); cursor: pointer; margin-bottom: 10px; display: block; text-align: left; }
.nl-row {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--surface);
  margin-bottom: 7px; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.nl-row.sel { border-color: var(--accent); background: rgba(245,200,66,.08); }
.nl-chk {
  width: 22px; height: 22px; flex-shrink: 0;
  border: 2px solid var(--border); border-radius: 6px;
  display: flex; align-items: center; justify-content: center; transition: all .15s;
}
.nl-row.sel .nl-chk { background: var(--accent); border-color: var(--accent); }
.nl-chk svg { opacity: 0; transition: opacity .15s; }
.nl-row.sel .nl-chk svg { opacity: 1; }
.nl-lbl { font-size: 15px; font-weight: 500; flex: 1; }

#toast {
  position: fixed; bottom: 82px; left: 50%;
  transform: translateX(-50%) translateY(60px);
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--text); padding: 9px 20px; border-radius: 30px;
  font-size: 14px; font-weight: 500; z-index: 11000;
  transition: transform .3s; pointer-events: none; white-space: nowrap;
}
#toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div id="toolbar">
  <div id="tb-top">
    <input type="text" id="new-item" placeholder="פריט חדש...">
    <button class="tb-btn" id="btn-add">+ הוסף</button>
    <button class="tb-btn" id="btn-del">🗑</button>
  </div>
  <div id="tb-grid">
    <button class="tb-btn" id="btn-update">עדכון</button>
    <button class="tb-btn" id="btn-auto">✨ סידור אוטו</button>
  </div>
</div>

<div id="main">
  <div id="paste-screen">
    <h1>🛒 רשימת קניות</h1>
    <p>הדבק רשימה – כל שורה תהפוך לפריט</p>
    <textarea id="paste-area" placeholder="חלב&#10;לחם&#10;גבינה&#10;..."></textarea>
    <button id="btn-confirm">✓ אישור – צור רשימה</button>
  </div>

  <div id="list-screen">
    <div id="stats">
      <div class="stat"><span class="stat-num" id="s-total">0</span><span class="stat-lbl">סה"כ</span></div>
      <div class="stat"><span class="stat-num" id="s-done">0</span><span class="stat-lbl">נקנו</span></div>
      <div class="stat"><span class="stat-num" id="s-left">0</span><span class="stat-lbl">נותרו</span></div>
    </div>
    <div id="prog-wrap"><div id="prog-bar" style="width:0%"></div></div>
    <div id="empty">✅ הרשימה ריקה</div>
    <div id="item-list"></div>
  </div>
</div>

<button id="btn-finish">🛒 סיימתי קניה</button>

<div class="overlay" id="ov-reset">
  <div class="modal">
    <div class="modal-icon">⚠️</div>
    <h3>איפוס רשימה</h3>
    <p>פעולה זו תמחק את כל הפריטים לצמיתות.</p>
    <div class="mbtn-row">
      <button id="reset-cancel">ביטול</button>
      <button id="reset-confirm" class="danger">מחק הכל</button>
    </div>
  </div>
</div>

<div class="overlay" id="ov-finish1">
  <div class="modal">
    <div class="modal-icon">🛍️</div>
    <h3>סיום קניה</h3>
    <p>האם לשמור פריטים לקניה הבאה?</p>
    <div class="mbtn-row">
      <button id="f1-no">לא, מחק הכל</button>
      <button id="f1-yes" class="primary">כן, בחר פריטים</button>
    </div>
  </div>
</div>

<div class="overlay" id="ov-finish2">
  <div class="modal wide">
    <div class="modal-icon">📋</div>
    <h3>בחר פריטים לקניה הבאה</h3>
    <p>סמן את הפריטים שרוצים לשמור</p>
    <div id="nl-items"></div>
    <div class="mbtn-row" style="margin-top:14px">
      <button id="f2-cancel">ביטול</button>
      <button id="f2-confirm" class="primary">✓ צור רשימה חדשה</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const LS = 'sl_v2';
let items = [];

function load() { try { items = JSON.parse(localStorage.getItem(LS)) || []; } catch { items = []; } }
function save() { localStorage.setItem(LS, JSON.stringify(items)); }
function uid()  { return Date.now().toString(36) + Math.random().toString(36).slice(2,5); }
function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function showPaste() {
  document.getElementById('paste-screen').style.display = 'flex';
  document.getElementById('list-screen').style.display  = 'none';
  document.getElementById('btn-finish').style.display   = 'none';
}
function showList() {
  document.getElementById('paste-screen').style.display = 'none';
  document.getElementById('list-screen').style.display  = 'block';
  document.getElementById('btn-finish').style.display   = 'block';
  render();
}

const CHK = `<svg width="13" height="13" viewBox="0 0 13 13" fill="none"><polyline points="2,6.5 5.5,10 11,3" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const XIC = `<svg width="15" height="15" viewBox="0 0 15 15" fill="none"><line x1="3.5" y1="3.5" x2="11.5" y2="11.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="11.5" y1="3.5" x2="3.5" y2="11.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`;

function makeItem(it, idx) {
  const d = document.createElement('div');
  d.className = 'item' + (it.done ? ' done' : '');
  d.innerHTML = `<div class="chk">${CHK}</div><span class="item-text">${esc(it.text)}</span><div class="item-x">${XIC}</div>`;
  d.querySelector('.chk').onclick       = e => { e.stopPropagation(); toggle(idx); };
  d.querySelector('.item-text').onclick = () => toggle(idx);
  d.querySelector('.item-x').onclick    = e => { e.stopPropagation(); del(idx); };
  return d;
}

function render(grouped) {
  const list = document.getElementById('item-list');
  const empty = document.getElementById('empty');
  list.innerHTML = '';
  if (!items.length) { empty.style.display='block'; updateStats(); return; }
  empty.style.display = 'none';
  if (grouped) {
    const groups = {};
    items.forEach((it,i) => { const c=it.cat||'כללי'; (groups[c]=groups[c]||[]).push({it,i}); });
    for (const [cat,arr] of Object.entries(groups)) {
      const l=document.createElement('div'); l.className='cat-label'; l.textContent=cat;
      list.appendChild(l);
      arr.forEach(({it,i}) => list.appendChild(makeItem(it,i)));
    }
  } else {
    items.forEach((it,i) => list.appendChild(makeItem(it,i)));
  }
  updateStats();
}

function updateStats() {
  const total=items.length, done=items.filter(i=>i.done).length;
  document.getElementById('s-total').textContent = total;
  document.getElementById('s-done').textContent  = done;
  document.getElementById('s-left').textContent  = total-done;
  document.getElementById('prog-bar').style.width = total ? Math.round(done/total*100)+'%' : '0%';
}

function toggle(idx) { items[idx].done=!items[idx].done; save(); render(); }
function del(idx)    { items.splice(idx,1); save(); render(); }

function reorder() {
  items=[...items.filter(i=>!i.done),...items.filter(i=>i.done)];
  save(); render(); toast('עדכון בוצע ✓');
}

const CATS = {
  'ירקות ופירות':['עגבנייה','עגבניות','מלפפון','חסה','גזר','בצל','שום','תפוח','בננה','תפוז','לימון','אבוקדו','פלפל','כרובית','ברוקולי','תרד','כרוב','קישוא','חציל','בטטה','תפוח אדמה','פטרייה','פטריות','ענבים','אבטיח','מלון','תות'],
  'מוצרי חלב':['חלב','גבינה','יוגורט','שמנת','חמאה','קוטג','לבן','מוצרלה'],
  'בשר ודגים':['עוף','בשר','בקר','הודו','כבש','דג','סלמון','טונה','שרימפס','נקניק','המבורגר','שניצל','קציצות'],
  'לחם ומאפים':['לחם','פיתה','בגט','חלה','לחמנייה','קרואסון','טוסט'],
  'שתייה':['מים','מיץ','קפה','תה','קולה','ספרייט','בירה','יין','סודה','נקטר'],
  'חטיפים וממתקים':['שוקולד','סוכריות','ביסלי','במבה','פופקורן','גלידה','עוגה','אגוזים','שקדים','חלבה'],
  'דגנים וקטניות':['אורז','פסטה','קוסקוס','עדשים','חומוס','שעועית','אפונה','קינואה','קמח','סולת'],
  'שמנים ותבלינים':['שמן','חומץ','מלח','פלפל שחור','פפריקה','כמון','כורכום','קינמון','דבש','סוכר','מיונז','קטשופ','חרדל'],
  'מוצרי ניקיון':['סבון','שמפו','מרכך','אקונומיקה','אבקת כביסה','נוזל כלים','ניר טואלט','קרם','משחת שיניים','דאודורנט'],
};
function detectCat(text) {
  const t=text.toLowerCase();
  for (const [cat,kws] of Object.entries(CATS)) if (kws.some(k=>t.includes(k))) return cat;
  return 'כללי';
}

async function autoSort() {
  if (!items.length) { toast('אין פריטים'); return; }
  const btn=document.getElementById('btn-auto');
  btn.textContent='⏳...'; btn.disabled=true;
  // Categorize locally using keyword matching (no external service required).
  items.forEach(it=>{it.cat=detectCat(it.text);});
  save(); render(true);
  btn.textContent='✨ סידור אוטו'; btn.disabled=false;
  toast('סידור לפי קטגוריות ✓');
}

function resetAll() { items=[]; localStorage.removeItem(LS); showPaste(); document.getElementById('paste-area').value=''; toast('הרשימה נמחקה'); }

function openFinish2() {
  closeOv('ov-finish1');
  const cont=document.getElementById('nl-items');
  cont.innerHTML=`<span class="nl-toggle" id="nl-tog">בחר הכל / בטל הכל</span>`;
  items.forEach((it,i)=>{
    const d=document.createElement('div');
    d.className='nl-row'; d.dataset.i=i;
    d.innerHTML=`<div class="nl-chk"><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><polyline points="1.5,6 5,9.5 10.5,2.5" stroke="#111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div><span class="nl-lbl">${esc(it.text)}</span>`;
    d.onclick=()=>d.classList.toggle('sel');
    cont.appendChild(d);
  });
  document.getElementById('nl-tog').onclick=()=>{
    const rows=cont.querySelectorAll('.nl-row');
    const all=[...rows].every(r=>r.classList.contains('sel'));
    rows.forEach(r=>r.classList.toggle('sel',!all));
  };
  openOv('ov-finish2');
}

function confirmNextList() {
  const sel=[...document.querySelectorAll('#nl-items .nl-row.sel')];
  const next=sel.map(el=>({id:uid(),text:items[parseInt(el.dataset.i)].text,done:false}));
  closeOv('ov-finish2');
  localStorage.removeItem(LS);
  if (!next.length){items=[];showPaste();toast('קניה הסתיימה 👍');return;}
  items=next; save(); showList();
  toast(`${next.length} פריטים נשמרו לקניה הבאה ✓`);
}

function openOv(id)  { document.getElementById(id).classList.add('show'); }
function closeOv(id) { document.getElementById(id).classList.remove('show'); }

function toast(msg) {
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('show'),2300);
}

// measure toolbar height and set padding dynamically
function fixPadding() {
  const h = document.getElementById('toolbar').getBoundingClientRect().height;
  document.getElementById('main').style.paddingTop = (h + 12) + 'px';
}

// events
document.getElementById('btn-confirm').onclick=()=>{
  const lines=document.getElementById('paste-area').value.split('\n').map(l=>l.trim()).filter(Boolean);
  if(!lines.length){toast('אנא הדבק פריטים');return;}
  items=lines.map(text=>({id:uid(),text,done:false}));
  save(); showList();
};
document.getElementById('btn-add').onclick=()=>{
  const inp=document.getElementById('new-item');
  if(!inp.value.trim()){inp.focus();return;}
  const t=inp.value.trim(); inp.value=''; inp.focus();
  items.push({id:uid(),text:t,done:false}); save();
  if(document.getElementById('list-screen').style.display==='none') showList(); else render();
  toast('פריט נוסף ✓');
};
document.getElementById('new-item').onkeydown=e=>{if(e.key==='Enter')document.getElementById('btn-add').click();};
document.getElementById('btn-update').onclick=reorder;
document.getElementById('btn-auto').onclick=autoSort;
document.getElementById('btn-del').onclick=()=>openOv('ov-reset');
document.getElementById('btn-finish').onclick=()=>openOv('ov-finish1');
document.getElementById('reset-cancel').onclick=()=>closeOv('ov-reset');
document.getElementById('reset-confirm').onclick=()=>{closeOv('ov-reset');resetAll();};
document.getElementById('ov-reset').onclick=e=>{if(e.target.id==='ov-reset')closeOv('ov-reset');};
document.getElementById('f1-no').onclick=()=>{closeOv('ov-finish1');resetAll();};
document.getElementById('f1-yes').onclick=openFinish2;
document.getElementById('ov-finish1').onclick=e=>{if(e.target.id==='ov-finish1')closeOv('ov-finish1');};
document.getElementById('f2-cancel').onclick=()=>closeOv('ov-finish2');
document.getElementById('f2-confirm').onclick=confirmNextList;
document.getElementById('ov-finish2').onclick=e=>{if(e.target.id==='ov-finish2')closeOv('ov-finish2');};

window.addEventListener('resize', fixPadding);
load();
if(items.length) showList(); else showPaste();
fixPadding();
</script>
</body>
</html>
